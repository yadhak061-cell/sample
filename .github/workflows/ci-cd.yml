name: Build and Deploy to AKS

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: web-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU (for multi-arch, optional)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure CLI
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: Azure ACR login
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build and push Docker image to ACR
      env:
        ACR_NAME: ${{ secrets.ACR_NAME }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
      run: |
        # tag: <acr-login-server>/<image>:<sha>
        ACR_LOGIN_SERVER=$(az acr show -n $ACR_NAME --query "loginServer" -o tsv)
        IMAGE_TAG=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA::8}
        docker build -t $IMAGE_TAG ./app
        docker push $IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Get AKS credentials
      run: |
        az aks get-credentials -n ${{ secrets.AKS_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --overwrite-existing

    - name: Update k8s manifest image and deploy
      env:
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        # replace placeholder in deployment manifest and apply
        sed -i "s|REPLACE_WITH_IMAGE|${IMAGE_TAG}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/web-demo --timeout=120s
        kubectl get svc web-demo-svc -o wide